---
- name: restart zabbix-agent
  ansible.builtin.service:
    name: "{{ zabbix_agent_service }}"
    state: restarted
    enabled: true
  become: true
  when:
    - not zabbix_agent_docker
    - ansible_facts['os_family'] not in ["Darwin", "Windows"]

- name: firewalld-reload
  ansible.builtin.command: "firewall-cmd --reload"
  become: true
  when:
    - ansible_facts.services["firewalld"] is defined
    - ansible_facts.services["firewalld"].state == "running"

- name: restart win zabbix agent
  ansible.windows.win_service:
    name: "{{ zabbix_agent_win_service }}"
    state: restarted
  when:
    - ansible_facts['os_family'] == "Windows"

- name: restart mac zabbix-agent
  community.general.launchd:
    name: com.zabbix.zabbix_agentd
    state: restarted
  become: true
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not zabbix_agent_docker

- name: restart sysctl
  ansible.builtin.service:
    name: sysctl
    state: restarted
  become: true
  when:
    - ansible_facts.os_family == "FreeBSD"
