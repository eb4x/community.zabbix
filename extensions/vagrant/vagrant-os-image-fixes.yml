  tasks:
    - name: Propagate ssh keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', ssh_key_path) }}"
      vars:
        ssh_key_path: "{{ lookup('first_found', ssh_key_paths) }}"
        ssh_key_paths:
          - "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
          - "{{ lookup('env', 'HOME') }}/.ssh/id_ecdsa.pub"
          - "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"

    - name: Remove buster-backports
      when: ansible_facts['os_family'] == 'Debian'
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '^.*buster-backports.*$'
        state: absent
      become: true

    - debug:
        var: ansible_facts['distribution_version']

#    - name: Add openSUSE repos
#      when: ansible_facts['os_family'] == 'Suse'
#      ansible.builtin.zypper_repository:
#        name: "{{ item.name }}"
#        repo: "{{ item.repo }}"
#        auto_import_keys: true
#        enabled: true
#        autorefresh: true
#      become: true
#      loop:
#        - name: leap-oss
#          repo: "https://download.opensuse.org/distribution/leap/{{ ansible_facts['distribution_version'] }}/repo/oss/"

    - name: Install potentially missing packages
      when: ansible_facts['system'] == 'Linux'
      package:
        name: "{{ _packages | select | list }}"
        state: "{{ (ansible_facts['os_family'] == 'Suse') | ternary('latest', 'present') }}"
        update_cache: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(true, omit) }}"
      vars:
        _packages:
          - acl # Fix become_user issues
          - bash-completion
          - gpg
          - "{{ (ansible_facts['os_family'] == 'Suse') | ternary('libexpat1', '') }}"
      become: true

    - name: Install/upgrade FreeBSD packages
      when: ansible_facts['os_family'] == 'FreeBSD'
      become: true
      block:
        - package:
            name:
              - python3
              - pcre2
            state: latest
        # state: latest doesn't work on freebsd? so we force the upgrade
        - name: Upgrade pcre2
          command:
            cmd: pkg install -y pcre2
          register: _res
        - debug:
            var: _res

    - name: Locale_gen
      when: ansible_facts['distribution'] == 'Debian'
      become: true
      community.general.locale_gen:
        name: en_US.UTF-8

    - name: Set shell to bash
      user:
        name: "{{ ansible_user }}"
        shell: /bin/bash
      become: true

