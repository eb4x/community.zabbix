---
- hosts: all

  pre_tasks:
    - name: Patch CA for vagrant
      become: true
      block:
        - name: Add Vagrant CA to trust
          copy:
            content: |
              {{ lookup('file', 'ca/Vagrant_Intermediate_CA.crt') }}
              {{ lookup('file', 'ca/Vagrant_Root_CA.crt') }}
            dest: "{{ _dest[ansible_facts.os_family] }}"
          vars:
            _dest:
              Debian: /usr/local/share/ca-certificates/vagrant.crt
              RedHat: /etc/pki/ca-trust/source/anchors/vagrant.pem
              Suse: /etc/pki/trust/anchors/vagrant.pem
          register: _ca
        - name: Update CA trust
          when: _ca is changed
          command:
            cmd: "{{ _cmd[ansible_facts.os_family] }}"
          vars:
            _cmd:
              Debian: update-ca-certificates
              RedHat: update-ca-trust
              Suse: update-ca-certificates

