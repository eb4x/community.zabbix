---
- name: Fake letsencrypt deployment
  hosts: all
  become: true

  tasks:
    - name: create dirs
      file:
        state: directory
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "/etc/letsencrypt"
          mode: "0755"
        - path: "/etc/letsencrypt/live"
          mode: "0700"
        - path: "/etc/letsencrypt/live/{{ ansible_facts.fqdn }}"
          mode: "0755"

    - name: dump certificates
      copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - dest: "/etc/letsencrypt/live/{{ ansible_facts.fqdn }}/cert.pem"
          content: |
            {{ lookup('file', 'certs/' ~ ansible_facts.fqdn ~ '.crt') }}
          mode: "0644"
        - dest: "/etc/letsencrypt/live/{{ ansible_facts.fqdn }}/privkey.pem"
          content: |
            {{ lookup('file', 'certs/' ~ ansible_facts.fqdn ~ '.key') }}
          mode: "0600"
        - dest: "/etc/letsencrypt/live/{{ ansible_facts.fqdn }}/chain.pem"
          content: |
            {{ lookup('file', 'ca/Vagrant_Intermediate_CA.crt') }}
          mode: "0644"
        - dest: "/etc/letsencrypt/live/{{ ansible_facts.fqdn }}/fullchain.pem"
          content: |
            {{ lookup('file', 'certs/' ~ ansible_facts.fqdn ~ '.crt') }}
            {{ lookup('file', 'ca/Vagrant_Intermediate_CA.crt') }}
          mode: "0644"
      loop_control:
        label: "{{ item.dest | basename }}"
